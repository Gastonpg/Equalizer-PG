plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gastonpg.equalizerpg'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gastonpg.equalizerpg'
        minSdk 28
        targetSdk 28
        versionCode 1
        versionName '0.1-alpha'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
